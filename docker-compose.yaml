version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # BASE DE DATOS VECTORIAL: PostgreSQL 16 con extensión pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: debateia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-debateia}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-debateia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debateia_net

  # ----------------------------------------------------------------------------
  # BACKEND FASTAPI: VAD, Diarización, STT faster-whisper, RAG y DeepSeek V3
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debateia_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret_password_change_me}@postgres:5432/${POSTGRES_DB:-debateia}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-debateia}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      CANDIDATE_PROFILE_PATH: /app/candidate_profile.npy
      SPEAKER_SIMILARITY_THRESHOLD: ${SPEAKER_SIMILARITY_THRESHOLD:-0.70}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      SILENCE_DURATION_MS: ${SILENCE_DURATION_MS:-400}
      MAX_UTTERANCE_MS: ${MAX_UTTERANCE_MS:-4500}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_B64: ${GOOGLE_SERVICE_ACCOUNT_B64:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/service_account.json
    volumes:
      - ./candidate_profile.npy:/app/candidate_profile.npy:ro
      - torch_cache:/root/.cache
    expose:
      - "8000"
    networks:
      - debateia_net
    labels:
      - "coolify.managed=true"
      # Configuración de Proxy Inverso Traefik para WebSockets en Coolify
      - "traefik.enable=true"
      - "traefik.http.routers.debateia-backend.rule=Host(`${BACKEND_DOMAIN:-api.debateia.local}`)"
      - "traefik.http.routers.debateia-backend.entrypoints=websecure"
      - "traefik.http.routers.debateia-backend.tls=true"
      - "traefik.http.routers.debateia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.debateia-backend.loadbalancer.server.port=8000"

  # ----------------------------------------------------------------------------
  # FRONTEND PWA: Next.js 14 Standalone Teleprompter UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://${BACKEND_DOMAIN:-api.debateia.local}/ws/audio}
    container_name: debateia_frontend
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://${BACKEND_DOMAIN:-api.debateia.local}/ws/audio}
    expose:
      - "3000"
    networks:
      - debateia_net
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.debateia-frontend.rule=Host(`${FRONTEND_DOMAIN:-debateia.local}`)"
      - "traefik.http.routers.debateia-frontend.entrypoints=websecure"
      - "traefik.http.routers.debateia-frontend.tls=true"
      - "traefik.http.routers.debateia-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.debateia-frontend.loadbalancer.server.port=3000"

volumes:
  pgvector_data:
    driver: local
  torch_cache:
    driver: local

networks:
  debateia_net:
    driver: bridge
